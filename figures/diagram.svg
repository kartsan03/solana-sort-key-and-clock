<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- sender -->
  <rect x="10" y="95" width="150" height="80" rx="4" fill="#f2f2f2" stroke="#333"/>
  <text x="85" y="118" text-anchor="middle" font-weight="bold">My sender</text>
  <text x="85" y="136" text-anchor="middle">6 probes, 6 payers,</text>
  <text x="85" y="152" text-anchor="middle">random send order,</text>
  <text x="85" y="168" text-anchor="middle">0.2–0.6 s before slot</text>
  <!-- ingress -->
  <rect x="220" y="20" width="190" height="56" rx="4" fill="#fff" stroke="#333"/>
  <text x="315" y="43" text-anchor="middle" font-weight="bold">Leader's own TPU</text>
  <text x="315" y="62" text-anchor="middle" font-size="11">Agave, Jito, Firedancer, Rakurai</text>
  <rect x="220" y="107" width="190" height="56" rx="4" fill="#fff" stroke="#333"/>
  <text x="315" y="130" text-anchor="middle" font-weight="bold">BAM node (shared)</text>
  <text x="315" y="149" text-anchor="middle">AgaveBam, FireBAM</text>
  <rect x="220" y="194" width="190" height="56" rx="4" fill="#fff" stroke="#333"/>
  <text x="315" y="217" text-anchor="middle" font-weight="bold">Harmonic remote TPU</text>
  <text x="315" y="236" text-anchor="middle" font-size="11">HarmonicAgave, HarmonicFiredancer</text>
  <path d="M160,135 L218,50" stroke="#333" fill="none" marker-end="url(#a)"/>
  <path d="M160,135 L218,135" stroke="#333" fill="none" marker-end="url(#a)"/>
  <path d="M160,135 L218,222" stroke="#333" fill="none" marker-end="url(#a)"/>
  <text x="190" y="285" text-anchor="middle" font-size="11" fill="#555">unstaked QUIC to the address the leader advertises in gossip</text>
  <!-- scheduler -->
  <rect x="470" y="95" width="120" height="80" rx="4" fill="#f2f2f2" stroke="#333"/>
  <text x="530" y="122" text-anchor="middle" font-weight="bold">Sort by</text>
  <text x="530" y="140" text-anchor="middle">which key?</text>
  <text x="530" y="160" text-anchor="middle" font-size="11">all 6 share one lock</text>
  <path d="M410,48 L468,120" stroke="#333" fill="none" marker-end="url(#a)"/>
  <path d="M410,135 L468,135" stroke="#333" fill="none" marker-end="url(#a)"/>
  <path d="M410,222 L468,150" stroke="#333" fill="none" marker-end="url(#a)"/>
  <!-- block -->
  <rect x="640" y="70" width="110" height="130" rx="4" fill="#fff" stroke="#333"/>
  <text x="695" y="90" text-anchor="middle" font-weight="bold">Block</text>
  <text x="695" y="110" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">… tx</text>
  <text x="695" y="128" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">D C F A E B</text>
  <text x="695" y="146" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">… tx</text>
  <text x="695" y="176" text-anchor="middle" font-size="11">order of my</text>
  <text x="695" y="190" text-anchor="middle" font-size="11">probes = the key</text>
  <path d="M590,135 L638,135" stroke="#333" fill="none" marker-end="url(#a)"/>
  <!-- fingerprint note -->
  <text x="530" y="225" text-anchor="middle" font-size="11">Fingerprint pair (panel P2):</text>
  <text x="530" y="242" text-anchor="middle" font-size="11" font-family="DejaVu Sans Mono, monospace">⌊R·10⁶/(C+1)⌋ → C F A</text>
  <text x="530" y="258" text-anchor="middle" font-size="11" font-family="DejaVu Sans Mono, monospace">R/C exact   → A F C</text>
</svg>
