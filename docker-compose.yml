# `docker compose up` recomputes every number from data/raw offline and fails on any
# difference from the committed data/derived. Other services are opt-in profiles.
services:
  analyze:
    build: .
    network_mode: none
    command: ["analyze"]

  test:
    profiles: ["test"]
    build: .
    network_mode: none
    entrypoint: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    command: []

  verify:
    profiles: ["verify"]
    build: .
    environment:
      - ITB_RPC_URL
      - VERIFY_ALL
    command: ["verify"]

  dryrun:
    profiles: ["dryrun"]
    build: .
    network_mode: host
    environment:
      - ITB_RPC_URL
    volumes: ["./state:/app/state"]
    # plan the next 15 minutes of the eight Tier-1 leaders' windows (design/dry-demo.json), then run it dry
    entrypoint: ["sh", "-c"]
    command: ["python -m itb.cli plan --targets design/dry-demo.json --run-id dry-demo --hours 0.25 --start-in-min 2 && python -m itb.cli run --plan state/plans/dry-demo.json"]

  live:
    profiles: ["live"]
    build: .
    network_mode: host
    environment:
      - ITB_LIVE
      - ITB_RPC_URL
      - ITB_KEYS_DIR=/run/itb-keys
    volumes:
      - "${ITB_KEYS_DIR:-../keys}:/run/itb-keys:ro"
      - "./state:/app/state"
      - "./data/raw:/app/data/raw"
    command: ["run", "--plan", "${ITB_PLAN:-missing-plan}", "--live", "--max-spend-sol", "${ITB_MAX_SPEND_SOL:-0}"]
